name: Scout Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Crear el proyecto Android
        run: |
          cat > settings.gradle.kts << 'SCOUT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScoutOverlay"
          include(":app")
          SCOUT_EOF

          cat > build.gradle.kts << 'SCOUT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          SCOUT_EOF

          cat > gradle.properties << 'SCOUT_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          SCOUT_EOF

          mkdir -p app
          cat > app/build.gradle.kts << 'SCOUT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.scout.overlay"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.scout.overlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              androidResources {
                  noCompress += "tflite"
              }
          }

          dependencies {
              implementation("com.google.mediapipe:tasks-vision:0.10.14")
          }
          SCOUT_EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'SCOUT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Scout Overlay"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ScoutService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/MainActivity.kt << 'SCOUT_EOF'
          package com.scout.overlay

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val reqCapture = 1001
              private val reqOverlay = 1002
              private val reqNotif = 1003
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER
                  root.setPadding(pad, pad, pad, pad)

                  val title = TextView(this)
                  title.text = "Scout Overlay"
                  title.textSize = 26f
                  title.gravity = Gravity.CENTER

                  status = TextView(this)
                  status.textSize = 15f
                  status.gravity = Gravity.CENTER
                  status.setPadding(0, pad, 0, pad)
                  status.text = "1) Toca Iniciar\n2) Acepta los permisos\n" +
                      "3) En la ventana de captura elige \"Toda la pantalla\"\n" +
                      "4) Abre DJI Fly: las detecciones aparecen encima del video\n\n" +
                      "Para terminar: Detener (aquí o en la notificación)."

                  val start = Button(this)
                  start.text = "Iniciar análisis"
                  start.setOnClickListener { begin() }

                  val stop = Button(this)
                  stop.text = "Detener"
                  stop.setOnClickListener {
                      stopService(Intent(this, ScoutService::class.java))
                      status.text = "Detenido."
                  }

                  root.addView(title)
                  root.addView(status)
                  root.addView(start)
                  root.addView(stop)
                  setContentView(root)
              }

              private fun begin() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Activa \"Mostrar sobre otras apps\" para Scout Overlay", Toast.LENGTH_LONG).show()
                      startActivityForResult(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")),
                          reqOverlay
                      )
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), reqNotif)
                      return
                  }
                  launchCapture()
              }

              private fun launchCapture() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  when (requestCode) {
                      reqOverlay -> {
                          if (Settings.canDrawOverlays(this)) begin()
                          else status.text = "Falta el permiso de mostrar sobre otras apps."
                      }
                      reqCapture -> {
                          if (resultCode == RESULT_OK && data != null) {
                              val svc = Intent(this, ScoutService::class.java)
                              svc.putExtra("code", resultCode)
                              svc.putExtra("data", data)
                              startForegroundService(svc)
                              moveTaskToBack(true)
                          } else {
                              status.text = "Captura cancelada."
                          }
                      }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == reqNotif) launchCapture()
              }
          }
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/OverlayView.kt << 'SCOUT_EOF'
          package com.scout.overlay

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.view.View

          class OverlayView(context: Context) : View(context) {

              class Box(
                  val l: Float,
                  val t: Float,
                  val r: Float,
                  val b: Float,
                  val label: String,
                  val score: Float,
                  val color: Int
              )

              @Volatile private var boxes: List<Box> = emptyList()
              @Volatile private var info: String = "Scout: iniciando..."

              private val d = resources.displayMetrics.density
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val text = Paint(Paint.ANTI_ALIAS_FLAG)

              init {
                  stroke.style = Paint.Style.STROKE
                  stroke.strokeWidth = 2.5f * d
                  fill.style = Paint.Style.FILL
                  text.color = Color.WHITE
                  text.textSize = 12f * d
                  text.typeface = Typeface.DEFAULT_BOLD
              }

              fun update(newBoxes: List<Box>, newInfo: String) {
                  boxes = newBoxes
                  info = newInfo
                  postInvalidate()
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()

                  for (bx in boxes) {
                      val rect = RectF(bx.l * w, bx.t * h, bx.r * w, bx.b * h)
                      stroke.color = bx.color
                      c.drawRect(rect, stroke)

                      val label = bx.label + " " + (bx.score * 100).toInt() + "%"
                      val tw = text.measureText(label)
                      val th = text.textSize + 6 * d
                      val top = if (rect.top - th < 0f) rect.top else rect.top - th
                      fill.color = bx.color
                      c.drawRect(rect.left, top, rect.left + tw + 8 * d, top + th, fill)
                      c.drawText(label, rect.left + 4 * d, top + th - 6 * d, text)
                  }

                  val iw = text.measureText(info)
                  fill.color = Color.argb(170, 0, 0, 0)
                  c.drawRoundRect(
                      8 * d, 8 * d,
                      8 * d + iw + 16 * d, 8 * d + text.textSize + 14 * d,
                      8 * d, 8 * d, fill
                  )
                  c.drawText(info, 16 * d, 8 * d + text.textSize + 6 * d, text)
              }
          }
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/ScoutService.kt << 'SCOUT_EOF'
          package com.scout.overlay

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.Icon
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Toast
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.objectdetector.ObjectDetector
          import kotlin.math.max
          import kotlin.math.roundToInt

          class ScoutService : Service() {

              companion object {
                  const val ACTION_STOP = "com.scout.overlay.STOP"
                  private const val CHANNEL = "scout"
                  private const val MAX_SIDE = 800          // lado mayor de la captura (menos = más rápido)
                  private const val MIN_INTERVAL_MS = 90L   // pausa mínima entre análisis (menos CPU)
                  private const val THRESHOLD = 0.40f       // confianza mínima
                  private const val MAX_RESULTS = 25

                  private val PALETTE = intArrayOf(
                      Color.rgb(255, 64, 64), Color.rgb(0, 200, 120), Color.rgb(64, 160, 255),
                      Color.rgb(255, 170, 0), Color.rgb(190, 100, 255), Color.rgb(0, 190, 210)
                  )

                  private val ES = mapOf(
                      "person" to "persona", "bicycle" to "bicicleta", "car" to "carro",
                      "motorcycle" to "moto", "airplane" to "avión", "bus" to "bus",
                      "train" to "tren", "truck" to "camión", "boat" to "bote",
                      "bird" to "ave", "cat" to "gato", "dog" to "perro", "horse" to "caballo",
                      "cow" to "vaca", "sheep" to "oveja", "backpack" to "mochila",
                      "umbrella" to "sombrilla", "bottle" to "botella", "chair" to "silla",
                      "couch" to "sofá", "bed" to "cama", "tv" to "tv", "laptop" to "portátil",
                      "cell phone" to "celular"
                  )
              }

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var detector: ObjectDetector? = null
              private var overlay: OverlayView? = null
              private var wm: WindowManager? = null
              private var dm: DisplayManager? = null
              private var thread: HandlerThread? = null
              private var handler: Handler? = null

              private var capW = 0
              private var capH = 0
              private var dpi = 0
              private var lastRun = 0L
              private var fps = 0f
              private var running = false

              private val projCallback = object : MediaProjection.Callback() {
                  override fun onStop() {
                      stopSelf()
                  }
              }

              private val displayListener = object : DisplayManager.DisplayListener {
                  override fun onDisplayAdded(displayId: Int) {}
                  override fun onDisplayRemoved(displayId: Int) {}
                  override fun onDisplayChanged(displayId: Int) {
                      if (displayId == Display.DEFAULT_DISPLAY) resizeCapture()
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startAsForeground()
                  if (running) return START_NOT_STICKY

                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent?.getParcelableExtra("data", Intent::class.java)
                  } else {
                      intent?.getParcelableExtra<Intent>("data")
                  }
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  running = true

                  val th = HandlerThread("scout")
                  th.start()
                  thread = th
                  val h = Handler(th.looper)
                  handler = h

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(projCallback, h)

                  // Cargar el modelo en el hilo de análisis
                  h.post {
                      try {
                          val options = ObjectDetector.ObjectDetectorOptions.builder()
                              .setBaseOptions(BaseOptions.builder().setModelAssetPath("model.tflite").build())
                              .setRunningMode(RunningMode.IMAGE)
                              .setMaxResults(MAX_RESULTS)
                              .setScoreThreshold(THRESHOLD)
                              .build()
                          detector = ObjectDetector.createFromOptions(this, options)
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post {
                              Toast.makeText(this, "Error cargando el modelo: " + e.message, Toast.LENGTH_LONG).show()
                              stopSelf()
                          }
                      }
                  }

                  val windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = windowManager
                  val ov = OverlayView(this)
                  overlay = ov
                  windowManager.addView(ov, overlayParams())

                  computeSize()
                  val r = newReader()
                  reader = r
                  virtualDisplay = proj.createVirtualDisplay(
                      "scout", capW, capH, dpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      r.surface, null, h
                  )

                  val displays = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  dm = displays
                  displays.registerDisplayListener(displayListener, h)

                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Scout Overlay", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopIntent = Intent(this, ScoutService::class.java)
                  stopIntent.action = ACTION_STOP
                  val stopPi = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE)
                  val action = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel),
                      "Detener",
                      stopPi
                  ).build()
                  val n = Notification.Builder(this, CHANNEL)
                      .setContentTitle("Scout Overlay activo")
                      .setContentText("Analizando la pantalla. Toca Detener para terminar.")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .addAction(action)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              // Ventana transparente que NO toma toques ni foco: DJI Fly sigue funcionando normal.
              private fun overlayParams(): WindowManager.LayoutParams {
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.alpha = 0.8f  // Android 12+: con más de 0.8 bloquearía los toques sobre DJI Fly
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  return lp
              }

              @Suppress("DEPRECATION")
              private fun computeSize() {
                  val m = DisplayMetrics()
                  wm?.defaultDisplay?.getRealMetrics(m)
                  dpi = m.densityDpi
                  val s = MAX_SIDE.toFloat() / max(m.widthPixels, m.heightPixels)
                  capW = max(2, (m.widthPixels * s).roundToInt())
                  capH = max(2, (m.heightPixels * s).roundToInt())
              }

              private fun newReader(): ImageReader {
                  val r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)
                  r.setOnImageAvailableListener({ rd -> onFrame(rd) }, handler)
                  return r
              }

              // Si giras la pantalla (DJI Fly va en horizontal), ajusta el tamaño de captura.
              private fun resizeCapture() {
                  val oldW = capW
                  val oldH = capH
                  computeSize()
                  if (oldW == capW && oldH == capH) return
                  try {
                      val nr = newReader()
                      virtualDisplay?.resize(capW, capH, dpi)
                      virtualDisplay?.surface = nr.surface
                      reader?.close()
                      reader = nr
                  } catch (e: Exception) {
                      // se reintenta en el próximo cambio de pantalla
                  }
              }

              private var prevStart = 0L

              private fun onFrame(rd: ImageReader) {
                  val image = try {
                      rd.acquireLatestImage()
                  } catch (e: Exception) {
                      null
                  } ?: return

                  val now = SystemClock.elapsedRealtime()
                  val det = detector
                  if (det == null || now - lastRun < MIN_INTERVAL_MS) {
                      image.close()
                      return
                  }
                  lastRun = now

                  var bmp: Bitmap? = null
                  try {
                      val w = image.width
                      val h = image.height
                      val p = image.planes[0]
                      val pad = p.rowStride - p.pixelStride * w
                      val full = Bitmap.createBitmap(w + pad / p.pixelStride, h, Bitmap.Config.ARGB_8888)
                      full.copyPixelsFromBuffer(p.buffer)
                      if (pad == 0) {
                          bmp = full
                      } else {
                          bmp = Bitmap.createBitmap(full, 0, 0, w, h)
                          full.recycle()
                      }
                  } catch (e: Exception) {
                      bmp = null
                  } finally {
                      image.close()
                  }
                  val b = bmp ?: return

                  try {
                      val res = det.detect(BitmapImageBuilder(b).build())
                      val out = ArrayList<OverlayView.Box>()
                      val counts = LinkedHashMap<String, Int>()
                      for (d in res.detections()) {
                          val c = d.categories().firstOrNull() ?: continue
                          val raw: String = c.categoryName() ?: continue
                          val name = ES[raw] ?: raw
                          val bb = d.boundingBox()
                          val color = PALETTE[(raw.hashCode() and 0x7fffffff) % PALETTE.size]
                          out.add(
                              OverlayView.Box(
                                  bb.left / b.width, bb.top / b.height,
                                  bb.right / b.width, bb.bottom / b.height,
                                  name, c.score(), color
                              )
                          )
                          counts[name] = (counts[name] ?: 0) + 1
                      }

                      if (prevStart != 0L) {
                          val inst = 1000f / max(1L, now - prevStart)
                          fps = if (fps == 0f) inst else fps * 0.8f + inst * 0.2f
                      }
                      prevStart = now

                      var info = "Scout " + fps.roundToInt() + " fps"
                      for ((k, v) in counts) info += " · $k $v"
                      overlay?.update(out, info)
                  } catch (e: Exception) {
                      // un cuadro fallido no detiene el análisis
                  } finally {
                      b.recycle()
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { dm?.unregisterDisplayListener(displayListener) } catch (e: Exception) {}
                  try { virtualDisplay?.release() } catch (e: Exception) {}
                  try { reader?.close() } catch (e: Exception) {}
                  try { overlay?.let { wm?.removeView(it) } } catch (e: Exception) {}
                  try {
                      projection?.unregisterCallback(projCallback)
                      projection?.stop()
                  } catch (e: Exception) {}
                  try {
                      thread?.quitSafely()
                      thread?.join(800)
                  } catch (e: Exception) {}
                  try { detector?.close() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          SCOUT_EOF

      - name: Descargar el modelo de deteccion
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/model.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite
          ls -la app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScoutOverlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk