name: Scout Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Crear el proyecto Android
        run: |
          cat > settings.gradle.kts << 'SCOUT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScoutOverlay"
          include(":app")
          SCOUT_EOF

          cat > build.gradle.kts << 'SCOUT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          SCOUT_EOF

          cat > gradle.properties << 'SCOUT_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          org.gradle.parallel=true
          org.gradle.caching=true
          SCOUT_EOF

          mkdir -p app
          cat > app/build.gradle.kts << 'SCOUT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.scout.overlay"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.scout.overlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.google.mediapipe:tasks-vision:0.10.14")
          }
          SCOUT_EOF

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'SCOUT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Scout Overlay"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ScoutService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/MainActivity.kt << 'SCOUT_EOF'
          package com.scout.overlay

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val reqCapture = 1001
              private val reqOverlay = 1002
              private val reqNotif = 1003
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER
                  root.setPadding(pad, pad, pad, pad)

                  val title = TextView(this)
                  title.text = "Scout Overlay"
                  title.textSize = 26f
                  title.gravity = Gravity.CENTER

                  status = TextView(this)
                  status.textSize = 15f
                  status.gravity = Gravity.CENTER
                  status.setPadding(0, pad, 0, pad)
                  status.text = "1) Toca Iniciar\n2) Acepta los permisos\n" +
                      "3) En la ventana de captura elige \"Toda la pantalla\"\n" +
                      "4) Abre DJI Fly: las siluetas aparecen encima del video\n\n" +
                      "Para terminar: Detener (aquí o en la notificación)."

                  val start = Button(this)
                  start.text = "Iniciar análisis"
                  start.setOnClickListener { begin() }

                  val stop = Button(this)
                  stop.text = "Detener"
                  stop.setOnClickListener {
                      stopService(Intent(this, ScoutService::class.java))
                      status.text = "Detenido."
                  }

                  root.addView(title)
                  root.addView(status)
                  root.addView(start)
                  root.addView(stop)
                  setContentView(root)
              }

              private fun begin() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Activa \"Mostrar sobre otras apps\" para Scout Overlay", Toast.LENGTH_LONG).show()
                      startActivityForResult(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")),
                          reqOverlay
                      )
                      return
                  }

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), reqNotif)
                      return
                  }

                  launchCapture()
              }

              private fun launchCapture() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)

                  when (requestCode) {
                      reqOverlay -> {
                          if (Settings.canDrawOverlays(this)) begin()
                          else status.text = "Falta el permiso de mostrar sobre otras apps."
                      }

                      reqCapture -> {
                          if (resultCode == RESULT_OK && data != null) {
                              val svc = Intent(this, ScoutService::class.java)
                              svc.putExtra("code", resultCode)
                              svc.putExtra("data", data)
                              startForegroundService(svc)
                              moveTaskToBack(true)
                          } else {
                              status.text = "Captura cancelada."
                          }
                      }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == reqNotif &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED
                  ) {
                      launchCapture()
                  }
              }
          }
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/OverlayView.kt << 'SCOUT_EOF'
          package com.scout.overlay

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.view.View
          import kotlin.math.max

          class OverlayView(context: Context) : View(context) {

              class Label(val x: Float, val y: Float, val text: String, val color: Int)

              private var maskBmp: Bitmap? = null
              @Volatile private var labels: List<Label> = emptyList()
              @Volatile private var info: String = "Scout: iniciando..."

              private val d = resources.displayMetrics.density
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val text = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bmpPaint = Paint(Paint.FILTER_BITMAP_FLAG)

              init {
                  fill.style = Paint.Style.FILL
                  text.color = Color.WHITE
                  text.textSize = 12f * d
                  text.typeface = Typeface.DEFAULT_BOLD
              }

              fun update(
                  pixels: IntArray,
                  mw: Int,
                  mh: Int,
                  newLabels: List<Label>,
                  newInfo: String
              ) {
                  post {
                      val current = maskBmp
                      val bitmap =
                          if (current != null && current.width == mw && current.height == mh) {
                              current
                          } else {
                              Bitmap.createBitmap(mw, mh, Bitmap.Config.ARGB_8888)
                                  .also { maskBmp = it }
                          }

                      bitmap.setPixels(pixels, 0, mw, 0, 0, mw, mh)
                      labels = newLabels
                      info = newInfo
                      invalidate()
                  }
              }

              fun updateInfo(newInfo: String) {
                  info = newInfo
                  postInvalidate()
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()

                  maskBmp?.let { c.drawBitmap(it, null, RectF(0f, 0f, w, h), bmpPaint) }

                  for (lb in labels) {
                      val tw = text.measureText(lb.text)
                      val th = text.textSize + 6 * d
                      val px = (lb.x * w).coerceIn(0f, max(0f, w - tw - 8 * d))
                      val py = (lb.y * h - th).coerceAtLeast(0f)
                      fill.color = lb.color
                      c.drawRect(px, py, px + tw + 8 * d, py + th, fill)
                      c.drawText(lb.text, px + 4 * d, py + th - 6 * d, text)
                  }

                  val iw = text.measureText(info)
                  fill.color = Color.argb(170, 0, 0, 0)
                  c.drawRoundRect(
                      8 * d, 8 * d,
                      8 * d + iw + 16 * d, 8 * d + text.textSize + 14 * d,
                      8 * d, 8 * d, fill
                  )
                  c.drawText(info, 16 * d, 8 * d + text.textSize + 6 * d, text)
              }
          }
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/TemporalMaskStabilizer.kt << 'SCOUT_EOF'
          package com.scout.overlay

          class TemporalMaskStabilizer(private val requiredFrames: Int = 2) {
              init {
                  require(requiredFrames >= 1)
              }

              private var stable: ByteArray? = null
              private var candidate = ByteArray(0)
              private var streak = IntArray(0)

              fun apply(input: ByteArray): ByteArray {
                  if (stable == null || stable!!.size != input.size) {
                      stable = input.copyOf()
                      candidate = input.copyOf()
                      streak = IntArray(input.size)
                      return stable!!.copyOf()
                  }

                  val current = stable!!
                  for (i in input.indices) {
                      val value = input[i]

                      if (value == current[i]) {
                          candidate[i] = value
                          streak[i] = 0
                      } else {
                          if (candidate[i] != value) {
                              candidate[i] = value
                              streak[i] = 1
                          } else {
                              streak[i]++
                          }

                          if (streak[i] >= requiredFrames) {
                              current[i] = value
                              streak[i] = 0
                          }
                      }
                  }

                  return current.copyOf()
              }
          }
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/MaskProcessor.kt << 'SCOUT_EOF'
          package com.scout.overlay

          class Blob(val cls: Int, val x: Int, val y: Int, val area: Int)
          class MaskResult(val pixels: IntArray, val blobs: List<Blob>)

          object MaskProcessor {

              fun process(
                  mask: ByteArray,
                  w: Int,
                  h: Int,
                  palette: IntArray,
                  minArea: Int,
                  fillAlpha: Int
              ): MaskResult {
                  val n = w * h
                  val pixels = IntArray(n)
                  val seen = BooleanArray(n)
                  val queue = IntArray(n)
                  val blobs = ArrayList<Blob>()

                  for (start in 0 until n) {
                      val cls = mask[start].toInt() and 0xFF
                      if (cls == 0 || seen[start]) continue

                      var head = 0
                      var tail = 0
                      queue[tail++] = start
                      seen[start] = true

                      while (head < tail) {
                          val p = queue[head++]
                          val x = p % w
                          val y = p / w

                          if (x > 0) {
                              val q = p - 1
                              if (!seen[q] && (mask[q].toInt() and 0xFF) == cls) {
                                  seen[q] = true
                                  queue[tail++] = q
                              }
                          }
                          if (x < w - 1) {
                              val q = p + 1
                              if (!seen[q] && (mask[q].toInt() and 0xFF) == cls) {
                                  seen[q] = true
                                  queue[tail++] = q
                              }
                          }
                          if (y > 0) {
                              val q = p - w
                              if (!seen[q] && (mask[q].toInt() and 0xFF) == cls) {
                                  seen[q] = true
                                  queue[tail++] = q
                              }
                          }
                          if (y < h - 1) {
                              val q = p + w
                              if (!seen[q] && (mask[q].toInt() and 0xFF) == cls) {
                                  seen[q] = true
                                  queue[tail++] = q
                              }
                          }
                      }

                      if (tail < minArea) continue

                      val rgb = palette[cls % palette.size] and 0x00FFFFFF
                      val fill = (fillAlpha shl 24) or rgb
                      val edge = (0xFF shl 24) or rgb

                      for (i in 0 until tail) {
                          val p = queue[i]
                          val x = p % w
                          val y = p / w
                          val isEdge =
                              x == 0 || x == w - 1 || y == 0 || y == h - 1 ||
                              (mask[p - 1].toInt() and 0xFF) != cls ||
                              (mask[p + 1].toInt() and 0xFF) != cls ||
                              (mask[p - w].toInt() and 0xFF) != cls ||
                              (mask[p + w].toInt() and 0xFF) != cls

                          pixels[p] = if (isEdge) edge else fill
                      }

                      blobs.add(Blob(cls, queue[0] % w, queue[0] / w, tail))
                  }

                  return MaskResult(pixels, blobs)
              }
          }
          SCOUT_EOF

          mkdir -p app/src/main/java/com/scout/overlay
          cat > app/src/main/java/com/scout/overlay/ScoutService.kt << 'SCOUT_EOF'
          package com.scout.overlay

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.Icon
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Toast
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.framework.image.ByteBufferExtractor
          import com.google.mediapipe.framework.image.MPImage
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.imagesegmenter.ImageSegmenter
          import kotlin.math.max
          import kotlin.math.roundToInt

          class ScoutService : Service() {

              companion object {
                  const val ACTION_STOP = "com.scout.overlay.STOP"
                  private const val CHANNEL = "scout"
                  private const val MAX_SIDE = 800
                  private const val MIN_INTERVAL_MS = 60L
                  private const val MIN_AREA = 30
                  private const val FILL_ALPHA = 90

                  private val PALETTE = intArrayOf(
                      Color.rgb(255, 64, 64), Color.rgb(0, 200, 120), Color.rgb(64, 160, 255),
                      Color.rgb(255, 170, 0), Color.rgb(190, 100, 255), Color.rgb(0, 190, 210),
                      Color.rgb(255, 90, 180), Color.rgb(160, 220, 40)
                  )

                  private val NAMES = arrayOf(
                      "fondo", "avión", "bicicleta", "ave", "bote", "botella", "bus", "carro",
                      "gato", "silla", "vaca", "mesa", "perro", "caballo", "moto", "persona",
                      "planta", "oveja", "sofá", "tren", "tv"
                  )
              }

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var segmenter: ImageSegmenter? = null
              private var overlay: OverlayView? = null
              private var wm: WindowManager? = null
              private var dm: DisplayManager? = null
              private var thread: HandlerThread? = null
              private var handler: Handler? = null

              private val maskStabilizer = TemporalMaskStabilizer(requiredFrames = 2)

              private var capW = 0
              private var capH = 0
              private var dpi = 0
              private var lastRun = 0L
              private var prevStart = 0L
              private var fps = 0f
              private var running = false

              private val projCallback = object : MediaProjection.Callback() {
                  override fun onStop() {
                      stopSelf()
                  }
              }

              private val displayListener = object : DisplayManager.DisplayListener {
                  override fun onDisplayAdded(displayId: Int) {}
                  override fun onDisplayRemoved(displayId: Int) {}
                  override fun onDisplayChanged(displayId: Int) {
                      if (displayId == Display.DEFAULT_DISPLAY) resizeCapture()
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  startAsForeground()
                  if (running) return START_NOT_STICKY

                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent?.getParcelableExtra("data", Intent::class.java)
                  } else {
                      intent?.getParcelableExtra<Intent>("data")
                  }

                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  running = true

                  val th = HandlerThread("scout")
                  th.start()
                  thread = th
                  val h = Handler(th.looper)
                  handler = h

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(projCallback, h)

                  h.post {
                      try {
                          val options = ImageSegmenter.ImageSegmenterOptions.builder()
                              .setBaseOptions(BaseOptions.builder().setModelAssetPath("model.tflite").build())
                              .setRunningMode(RunningMode.IMAGE)
                              .setOutputCategoryMask(true)
                              .setOutputConfidenceMasks(false)
                              .build()
                          segmenter = ImageSegmenter.createFromOptions(this, options)
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post {
                              Toast.makeText(this, "Error cargando el modelo: ${e.message}", Toast.LENGTH_LONG).show()
                              stopSelf()
                          }
                      }
                  }

                  val windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = windowManager
                  val ov = OverlayView(this)
                  overlay = ov
                  windowManager.addView(ov, overlayParams())

                  computeSize()
                  val r = newReader()
                  reader = r
                  virtualDisplay = proj.createVirtualDisplay(
                      "scout", capW, capH, dpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      r.surface, null, h
                  )

                  val displays = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  dm = displays
                  displays.registerDisplayListener(displayListener, h)

                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Scout Overlay", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopIntent = Intent(this, ScoutService::class.java)
                  stopIntent.action = ACTION_STOP
                  val stopPi = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE)
                  val action = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel),
                      "Detener",
                      stopPi
                  ).build()

                  val n = Notification.Builder(this, CHANNEL)
                      .setContentTitle("Scout Overlay activo")
                      .setContentText("Analizando la pantalla. Toca Detener para terminar.")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .addAction(action)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun overlayParams(): WindowManager.LayoutParams {
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.alpha = 0.8f
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  return lp
              }

              @Suppress("DEPRECATION")
              private fun computeSize() {
                  val m = DisplayMetrics()
                  wm?.defaultDisplay?.getRealMetrics(m)
                  dpi = m.densityDpi
                  val s = MAX_SIDE.toFloat() / max(m.widthPixels, m.heightPixels)
                  capW = max(2, (m.widthPixels * s).roundToInt())
                  capH = max(2, (m.heightPixels * s).roundToInt())
              }

              private fun newReader(): ImageReader {
                  val r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)
                  r.setOnImageAvailableListener({ rd -> onFrame(rd) }, handler)
                  return r
              }

              private fun resizeCapture() {
                  val oldW = capW
                  val oldH = capH
                  computeSize()
                  if (oldW == capW && oldH == capH) return

                  try {
                      val nr = newReader()
                      val proj = projection ?: return
                      val newDisplay = proj.createVirtualDisplay(
                          "scout",
                          capW,
                          capH,
                          dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          nr.surface,
                          null,
                          handler
                      )

                      virtualDisplay?.release()
                      virtualDisplay = newDisplay
                      reader?.close()
                      reader = nr
                  } catch (_: Exception) {
                  }
              }

              private fun onFrame(rd: ImageReader) {
                  val image = try {
                      rd.acquireLatestImage()
                  } catch (_: Exception) {
                      null
                  } ?: return

                  val now = SystemClock.elapsedRealtime()
                  val seg = segmenter
                  if (seg == null || now - lastRun < MIN_INTERVAL_MS) {
                      image.close()
                      return
                  }
                  lastRun = now

                  var bmp: Bitmap? = null
                  try {
                      val w = image.width
                      val h = image.height
                      val p = image.planes[0]
                      val pad = p.rowStride - p.pixelStride * w
                      val full = Bitmap.createBitmap(w + pad / p.pixelStride, h, Bitmap.Config.ARGB_8888)
                      full.copyPixelsFromBuffer(p.buffer)

                      bmp = if (pad == 0) {
                          full
                      } else {
                          val cropped = Bitmap.createBitmap(full, 0, 0, w, h)
                          full.recycle()
                          cropped
                      }
                  } catch (_: Exception) {
                      bmp = null
                  } finally {
                      image.close()
                  }

                  val b = bmp ?: return

                  try {
                      val res = seg.segment(BitmapImageBuilder(b).build())
                      val maskImg: MPImage? = res.categoryMask().orElse(null)

                      if (maskImg != null) {
                          val mw = maskImg.width
                          val mh = maskImg.height
                          val buf = ByteBufferExtractor.extract(maskImg)
                          val n = mw * mh

                          if (buf.capacity() >= n) {
                              val arr = ByteArray(n)
                              for (i in 0 until n) arr[i] = buf.get(i)

                              val stabilized = maskStabilizer.apply(arr)
                              val result = MaskProcessor.process(stabilized, mw, mh, PALETTE, MIN_AREA, FILL_ALPHA)

                              val labels = ArrayList<OverlayView.Label>()
                              val counts = LinkedHashMap<String, Int>()

                              for (bl in result.blobs) {
                                  val name = if (bl.cls < NAMES.size) NAMES[bl.cls] else "objeto"
                                  labels.add(
                                      OverlayView.Label(
                                          bl.x.toFloat() / mw,
                                          bl.y.toFloat() / mh,
                                          name,
                                          PALETTE[bl.cls % PALETTE.size]
                                      )
                                  )
                                  counts[name] = (counts[name] ?: 0) + 1
                              }

                              if (prevStart != 0L) {
                                  val inst = 1000f / max(1L, now - prevStart)
                                  fps = if (fps == 0f) inst else fps * 0.8f + inst * 0.2f
                              }
                              prevStart = now

                              var info = "Scout ${fps.roundToInt()} fps"
                              for ((k, v) in counts) info += " · $k $v"
                              overlay?.update(result.pixels, mw, mh, labels, info)
                          }
                      }
                  } catch (_: Exception) {
                  } finally {
                      b.recycle()
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { dm?.unregisterDisplayListener(displayListener) } catch (_: Exception) {}
                  try { virtualDisplay?.release() } catch (_: Exception) {}
                  try { reader?.close() } catch (_: Exception) {}
                  try { overlay?.let { wm?.removeView(it) } } catch (_: Exception) {}
                  try {
                      projection?.unregisterCallback(projCallback)
                      projection?.stop()
                  } catch (_: Exception) {}
                  try {
                      thread?.quitSafely()
                      thread?.join(800)
                  } catch (_: Exception) {}
                  try { segmenter?.close() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          SCOUT_EOF

      - name: Descargar el modelo de siluetas
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/model.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite
          ls -la app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 80 build.log
          if [ "$code" -ne 0 ]; then
            grep -E "^e: |What went wrong|Execution failed|Could not |error:|Caused by" build.log | head -15 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            {
              echo "### Errores de compilacion"
              echo '```'
              grep -n -E "^e: |What went wrong|Execution failed|Could not |error:|Caused by|^> " build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: ScoutOverlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk